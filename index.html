<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackDay 2026 | NIT Jamshedpur</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-[#f7f7f2] px-5 py-12 text-[#10201d] sm:py-20">
    <main class="mx-auto max-w-3xl">
      <header class="mb-10 text-center sm:mb-14">
        <p class="mb-4 inline-flex items-center gap-2 rounded-full bg-[#f5b726] px-4 py-2 text-sm font-bold tracking-wide text-[#10201d]">
          <span aria-hidden="true" class="h-2 w-2 rounded-full bg-[#e53927]"></span>
          OPEN SOURCE · BIG IDEAS
        </p>
        <h1 class="text-4xl font-black leading-tight tracking-tight sm:text-6xl">
          HackDay <span class="text-[#e53927]">2026</span>
        </h1>
        <p class="mt-2 text-xl font-semibold text-[#2e4742] sm:text-2xl">NIT Jamshedpur</p>
        <div class="mx-auto my-6 h-1 w-16 rounded-full bg-[#8bb2de]"></div>
        <p class="text-base font-medium text-[#52635f] sm:text-lg">
          In collaboration with
          <span class="font-bold text-[#10201d]">Hacktoberfest 2026</span>
        </p>
      </header>

      <section class="overflow-hidden my-5 rounded-3xl border border-[#e4e5da] bg-white shadow-xl shadow-[#10201d]/10">
        <div class="h-2 bg-gradient-to-r from-[#e53927] via-[#f5b726] to-[#8bb2de]"></div>
        <div class="p-7 sm:p-10">
          <div class="mb-8">
            <h2 class="mt-2 text-2xl font-extrabold sm:text-3xl">Team Information</h2>
          </div>
          <dl class="grid gap-4 sm:grid-cols-3">
            <div class="rounded-2xl bg-[#f7f7f2] p-5">
              <dt class="text-sm font-semibold text-[#52635f]">Team Name</dt>
              <dd class="mt-2 text-lg font-bold">Code blooded</dd>
            </div>
            <div class="rounded-2xl bg-[#d7e5f4] p-5">
              <dt class="text-sm font-semibold text-[#1f4e6b]">Team Leader</dt>
              <dd class="mt-2 text-lg font-bold">HARSHIT</dd>
            </div>
            <div class="rounded-2xl bg-[#fbe4a6] p-5">
              <dt class="text-sm font-semibold text-[#8a5d13]">Branch</dt>
              <dd class="mt-2 text-lg font-bold">ECE</dd>
            </div>
          </dl>
        </div>
      </section>      
    </main>
  </body>
</html>
